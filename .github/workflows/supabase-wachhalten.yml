# Hält das kostenlose Supabase-Projekt aktiv: Supabase pausiert Projekte nach 7 Tagen ohne Aktivität.
name: Supabase wachhalten

on:
  schedule:
    - cron: "17 6 * * 1,4"   # Montag und Donnerstag, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datenbank anfragen
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'eyJ[^"]*' config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
